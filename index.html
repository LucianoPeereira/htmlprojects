<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    .container-box {
        display: grid;
        grid-template-columns: 250px 250px 250px;
        grid-template-rows: 250px 250px;
        gap: 10px;
    }

    #box-1 {
        grid-column-start: 1;
        grid-column-end: 3;
    }

    #box-4 {
        grid-column: 2/4
    }

    .box {
        display: flex;
        justify-content: center;
        /* Align elements horizontally - Main Axis*/
        align-items: center;
        /* Align elements vertically - Cross Axis*/
        background-color: #5f5d5d33;
        border: 1px solid white;
        border-radius: 10px;
        font-size: 40pt;
        color: white;
    }
</style>

<body>
    <nav>
        <a href="index.html" class="active">Template 1</a>
        <a href="template2.html">Template 2</a>
       
    </nav>

    <div class="container-box">
        <div id="box-1" class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div id="box-4" class="box">4</div>
    </div>
</body>

</html>
